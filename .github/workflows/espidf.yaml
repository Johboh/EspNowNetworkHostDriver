name: ESP-IDF CI Host Driver

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - name: v50_build
            version_number: release-v5.0
            target: esp32c3
          - name: v51_build
            version_number: release-v5.1
            target: esp32c6
          - name: v52_build
            version_number: release-v5.2
            target: esp32c6
          - name: v53_build
            version_number: release-v5.3
            target: esp32c6
          - name: v54_build
            version_number: release-v5.4
            target: esp32c6
          - name: v55_build
            version_number: release-v5.5
            target: esp32c6
          - name: v60_build
            version_number: release-v6.0
            target: esp32c6
          - name: v61_build
            version_number: release-v6.1
            target: esp32c6
        path:
          - name: examples/espidf/host_driver

    steps:
      - uses: actions/checkout@v4

      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.version.version_number }}
          target: ${{ matrix.version.target }}
          path: ${{ matrix.path.name }}

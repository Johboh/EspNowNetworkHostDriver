name: ESP-IDF CI Host Driver

on:
  workflow_call:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - name: v53_build
            version_number: release-v5.3
            target: esp32c6
          - name: v54_build
            version_number: release-v5.4
            target: esp32c6
        path:
          - name: examples/espidf/host_driver

    steps:
      - uses: actions/checkout@v4

      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.version.version_number }}
          target: ${{ matrix.version.target }}
          path: ${{ matrix.path.name }}

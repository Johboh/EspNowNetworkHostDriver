name: PlatformIO CI Host Driver

on:
  workflow_call:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - path: examples/arduino/host_driver
            library: library.json
            remove: ""
            extra_dependencies: "johboh/MQTTRemote@^6.0.5, johboh/ConnectionHelper@^3.0.18"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Remove files
        run: rm -rf ${{ matrix.target.remove }}
        if: ${{ matrix.target.remove }}

      - name: Copy library.json to root (if not src is also in root)
        run: mv ${{ matrix.target.library }} ./ || true
        if: ${{ matrix.target.library != './library.json' }}

      - name: Build PlatformIO targets
        run: ${{ env.PLATFORMIO_CI_BASE_CMD }} --project-option="lib_deps=${{ matrix.target.extra_dependencies }}"
        env:
          PLATFORMIO_CI_BASE_CMD: pio ci --lib="." --board=lolin_c3_mini --project-option="build_unflags=-std=gnu++11" --project-option="build_flags=-std=gnu++17" --project-option="lib_ldf_mode=deep" --project-option="board_build.partitions=huge_app.csv"
          PLATFORMIO_CI_SRC: ${{ matrix.target.path }}
